    "NSScrollView",
    "NSScroller",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSStringDrawing",
    "NSText",
    "NSTextField",
    "NSTrackingArea",
    "NSTouch",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
    "NSWorkspace",
    "block2",
    "objc2-core-foundation",
