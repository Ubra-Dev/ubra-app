[package]
name = "ubra-term"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ubra-proto.workspace = true
ubra-telemetry.workspace = true
gpui.workspace = true
unicode-width = "0.2.2"

[dev-dependencies]
ubra-terminal-state.workspace = true
criterion = "0.5.1"
gpui = { workspace = true, features = ["bench"] }
gpui_platform = { workspace = true, features = ["test-support"] }

[[bench]]
name = "terminal_renderer"
harness = false

[[bench]]
name = "reading_view"
harness = false

[[bench]]
name = "find_retained"
harness = false

[[bench]]
name = "terminal_interactions"
harness = false
