    "NSEvent",
    "NSFont",
    "NSFontDescriptor",
    "NSFontManager",
    "NSGradient",
    "NSGraphics",
    "NSGraphicsContext",
    "NSHapticFeedback",
    "NSImage",
    "NSImageCell",
    "NSImageView",
    "NSImageRep",
